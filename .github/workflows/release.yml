name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      # 配置了这些 secrets 就走 Developer ID 签名 + Apple 公证，否则只跑测试并提示跳过发布。
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
      NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
      NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 测试
        run: npm test
      - name: 导入 Developer ID 证书
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 -D > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"
      - name: 导入公证 API Key
        if: env.NOTARY_API_KEY_P8 != ''
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$NOTARY_API_KEY_P8" | base64 -D > "$RUNNER_TEMP/private_keys/AuthKey.p8"
      - name: 打包（签名 + 公证）
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        env:
          BOBO_BUILD: ${{ github.run_number }}
          NOTARY_API_KEY: ${{ env.NOTARY_API_KEY_P8 != '' && format('{0}/private_keys/AuthKey.p8', runner.temp) || '' }}
        run: node scripts/package-release.mjs
      - name: 创建 GitHub Release
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/bobo.app.zip dist/bobo.app.zip.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
      - name: 未配置签名证书
        if: env.BUILD_CERTIFICATE_BASE64 == ''
        run: |
          echo "::warning::没有配置 Developer ID 签名（secrets.BUILD_CERTIFICATE_BASE64），已跳过打包与发布；配置方式见 docs/features.md 的「发布」一节，或在本机执行 npm run package 后手动发布。"
